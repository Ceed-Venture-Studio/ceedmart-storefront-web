# REVALIDATE_SECRET is read from substitution _REVALIDATE_SECRET to avoid
# committing the real secret. Pass it at build time:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_REVALIDATE_SECRET=$(cat /path/to/secret)
substitutions:
  _REVALIDATE_SECRET: supersecret  # placeholder; override via --substitutions

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--build-arg"
      - "MEDUSA_BACKEND_URL=https://ceedmart-api-870514614467.europe-west1.run.app"
      - "--build-arg"
      - "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_870f35bd3ecc53fdd67f7475dd17e290e6a7b8e249070851deb4bab58672b002"
      - "--build-arg"
      - "NEXT_PUBLIC_BASE_URL=https://ceedmart-storefront-870514614467.europe-west1.run.app"
      - "--build-arg"
      - "NEXT_PUBLIC_DEFAULT_REGION=ng"
      - "--build-arg"
      - "REVALIDATE_SECRET=${_REVALIDATE_SECRET}"
      - "-t"
      - "europe-west1-docker.pkg.dev/ceedmart/ceedmart-docker/storefront:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "europe-west1-docker.pkg.dev/ceedmart/ceedmart-docker/storefront:latest"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "ceedmart-storefront"
      - "--image"
      - "europe-west1-docker.pkg.dev/ceedmart/ceedmart-docker/storefront:latest"
      - "--region"
      - "europe-west1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      # --update-env-vars, NOT --set-env-vars: the latter REPLACES the whole
      # env block, so any var set out-of-band would be silently wiped on the
      # next deploy. FEATURED_PRODUCT_TAG is meant to be changed with
      # `gcloud run services update` without a rebuild, so it has to survive.
      - "--update-env-vars"
      - "MEDUSA_BACKEND_URL=https://ceedmart-api-870514614467.europe-west1.run.app,REVALIDATE_SECRET=${_REVALIDATE_SECRET}"
      - "--min-instances"
      - "1"
      - "--max-instances"
      - "10"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--port"
      - "8000"

options:
  logging: CLOUD_LOGGING_ONLY
